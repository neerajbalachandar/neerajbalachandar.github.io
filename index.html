    <script>
    document.addEventListener("DOMContentLoaded", function () {
        // Reverse publication order (fix upside down)
        var pubList = document.querySelector("#publications ul, .publications ul, #publications .pub-list, .publications .pub-list");
        if (pubList) {
            var items = Array.from(pubList.children);
            items.reverse().forEach(function (item) { pubList.appendChild(item); });
        }

        // Apply DOI / Project / GitHub logic
        var pubItems = document.querySelectorAll("#publications li, .publications li");
        pubItems.forEach(function (li) {
            var titleLink = li.querySelector(".pub-title, a.title, h3 a, li > a");
            if (!titleLink) return;

            var doi = li.getAttribute("data-doi");
            var project = li.getAttribute("data-project");
            var github = li.getAttribute("data-github");

            if (doi) {
                titleLink.href = doi;
                titleLink.target = "_blank";
            } else if (project) {
                titleLink.href = project;
                titleLink.target = "_blank";
            }

            var linksDiv = document.createElement("div");
            linksDiv.className = "pub-links";

            if (github) {
                var gh = document.createElement("a");
                gh.href = github; gh.textContent = "GitHub"; gh.target = "_blank";
                linksDiv.appendChild(gh);
            }
            if (project) {
                var proj = document.createElement("a");
                proj.href = project; proj.textContent = "Project"; proj.target = "_blank";
                linksDiv.appendChild(proj);
            }
            if (linksDiv.children.length > 0) {
                titleLink.insertAdjacentElement("afterend", linksDiv);
            }
        });
    });
    </script>
    

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        // 1. Find publication list, convert UL to OL for proper numbering
        var pubList = document.querySelector("#publications ul, .publications ul, #publications .pub-list, .publications .pub-list");
        if (pubList) {
            var newOl = document.createElement('ol');
            newOl.className = pubList.className; // retain classes
            while (pubList.firstChild) {
                newOl.appendChild(pubList.firstChild); // move items
            }
            pubList.parentNode.replaceChild(newOl, pubList);
            
            // 2. Reverse publication order (fix upside down)
            var items = Array.from(newOl.children);
            items.reverse().forEach(function (item) { newOl.appendChild(item); });
        }

        // 3. Apply Title Links and Small Keywords Logic
        var pubItems = document.querySelectorAll("#publications li, .publications li");
        pubItems.forEach(function (li) {
            var titleLink = li.querySelector(".pub-title, a.title, h3 a, li > a:first-child");
            if (!titleLink) return;

            var paper = li.getAttribute("data-paper");
            var project = li.getAttribute("data-project");
            var github = li.getAttribute("data-github");

            var linksDiv = document.createElement("div");
            linksDiv.className = "pub-links";

            if (paper) {
                // Publication exists: Title -> Paper, add Project & Github links
                titleLink.href = paper;
                titleLink.target = "_blank";
                
                if (project) {
                    var projA = document.createElement("a");
                    projA.href = project; projA.textContent = "Project"; projA.target = "_blank";
                    linksDiv.appendChild(projA);
                }
                if (github) {
                    var ghA = document.createElement("a");
                    ghA.href = github; ghA.textContent = "GitHub"; ghA.target = "_blank";
                    linksDiv.appendChild(ghA);
                }
            } else {
                // No publication: Title -> Project, add Github link alone
                if (project) {
                    titleLink.href = project;
                    titleLink.target = "_blank";
                }
                if (github) {
                    var ghA = document.createElement("a");
                    ghA.href = github; ghA.textContent = "GitHub"; ghA.target = "_blank";
                    linksDiv.appendChild(ghA);
                }
            }

            if (linksDiv.children.length > 0) {
                titleLink.insertAdjacentElement("afterend", linksDiv);
            }
        });
    });
    </script>
    

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        // --- 1. REMOVE SECTIONS ---
        document.querySelectorAll('#photography, .photography, #extracurricular, .extracurricular, #skills, .technical-skills, #coursework, .coursework').forEach(el => el.remove());

        // --- 2. EXPERIENCE -> TITLES ONLY, MOVE POINTS TO PAST PROJECTS ---
        let expSection = document.querySelector('#experience, .experience');
        if (expSection) {
            let pastProjects = document.createElement('div');
            pastProjects.id = 'past-projects';
            let h2 = document.createElement('h2');
            h2.innerText = 'Past Projects';
            h2.style.color = '#8b0000';
            h2.style.borderBottom = '2px solid #f0e0e0';
            pastProjects.appendChild(h2);

            // Find all list items in experience, move them to past projects
            expSection.querySelectorAll('ul').forEach(ul => {
                pastProjects.appendChild(ul);
            });

            // Insert Past Projects after Experience
            expSection.parentNode.insertBefore(pastProjects, expSection.nextSibling);
        }

        // --- 3. (blog block removed) ---
        // --- 4. MAKE RECENT ACTIVITY ENGAGING (ArXiv Badges) ---
        let recentLis = document.querySelectorAll('#recent-activity li, .recent-activity li');
        recentLis.forEach(li => {
            if(li.innerText.toLowerCase().includes('arxiv')) {
                let badge = document.createElement('a');
                badge.className = 'arxiv-badge';
                badge.href = '#';
                badge.innerText = 'arXiv';
                li.prepend(badge);
            }
        });
    });
    </script>
